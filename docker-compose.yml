version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: semantic-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-semantic_search}
      POSTGRES_USER: ${DB_USER:-pablo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pablo} -d ${DB_NAME:-semantic_search}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semantic-search-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-semantic_search}
      DB_USER: ${DB_USER:-pablo}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semantic-search-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
